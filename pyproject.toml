[project]
name = "ollamamaker"
version = "0.1.0"
description = "Create tuned Ollama models and local opencode config from hardware-aware recommendations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["InquirerPy>=0.3.4"]

[project.scripts]
ollamamaker = "ollamamaker.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollamamaker"]

[tool.ruff]
exclude = [".dev"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["D", "T201", "S", "BLE001", "PLR", "PTH123", "PERF401", "RUF012", "RUF100"]
